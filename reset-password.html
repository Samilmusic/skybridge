<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Account recovery | Sky Bridge</title><link rel="stylesheet" href="shared.css?v=5c22fec66e9d"><style>body{margin:0;background:#00211e;color:#f4fff9;font:16px/1.7 system-ui}.box{max-width:460px;margin:70px auto;padding:25px}input,button{font:inherit;padding:14px;border-radius:12px;width:100%;box-sizing:border-box;margin:10px 0}button{background:#d5fb09;border:0}a{color:#d5fb09}</style><meta name="description" content="Visa assistance, travel experiences and digital services from Sky Bridge FZE LLC in Ajman, UAE."><link rel="canonical" href="https://skybridgefze.com/reset-password.html"><meta property="og:type" content="website"><meta property="og:site_name" content="Sky Bridge FZE LLC"><meta property="og:title" content="Account recovery | Sky Bridge"><meta property="og:description" content="Visa assistance, travel experiences and digital services from Sky Bridge FZE LLC in Ajman, UAE."><meta property="og:url" content="https://skybridgefze.com/reset-password.html"><meta name="twitter:card" content="summary"></head><body><main class="box"><a href="index.html">← Sky Bridge</a><h1>Account recovery</h1><form id="recovery"><label>Email address<input id="recoveryEmail" type="email" required autocomplete="email" maxlength="250"></label><button>Send recovery link</button></form><form id="newPassword" hidden><label>New password<input id="newPasswordValue" type="password" minlength="8" required autocomplete="new-password"></label><button>Update password</button></form><p id="recoveryMessage" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script><script src="config.js?v=6ce8f946ec9b"></script><script src="shared.js?v=2bca6e822a86"></script><script>
(()=>{const db=window.SkyBridgeDB,msg=document.querySelector('#recoveryMessage'),form=document.querySelector('#recovery');if(!db){msg.textContent='Recovery is temporarily unavailable. Contact our team.';form.hidden=true;return;}db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){form.hidden=true;document.querySelector('#newPassword').hidden=false;}});form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const{error}=await db.auth.resetPasswordForEmail(document.querySelector('#recoveryEmail').value,{redirectTo:location.origin+'/reset-password.html'});msg.textContent=error?'Unable to request a recovery link. Please retry.':'If the account is eligible, a recovery link will be sent to its email address.';}catch{msg.textContent='Connection failed. Please retry.';}finally{b.disabled=false}};document.querySelector('#newPassword').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{const{error}=await db.auth.updateUser({password:document.querySelector('#newPasswordValue').value});msg.textContent=error?'Unable to update the password. Open a fresh recovery link.':'Password updated. You can now return to the customer portal.';if(!error){document.querySelector('#newPassword').hidden=true;await db.auth.signOut();}}catch{msg.textContent='Connection failed. Please retry.';}finally{b.disabled=false}}})();
</script></body></html>
